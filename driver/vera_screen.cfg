# vera_screen.cfg - the screen driver: BASIC stub and installer at $0801,
# resident part run at $C000-$CFFF (copied there by the installer).
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $9000;
    RES:      file = "", start = $C000, size = $1000, define = yes;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN, type = ro;
    STARTUP:  load = MAIN, type = ro;
    RESIDENT: load = MAIN, run = RES, type = rw, define = yes;
    FONT:     load = MAIN, type = ro;
    RESBSS:   load = RES, type = bss, define = yes;
}

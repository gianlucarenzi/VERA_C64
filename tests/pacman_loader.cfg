# pacman_loader.cfg - ld65: the loader of Pac-Man (pacman_loader.s).  A PRG
# for $0801: the BASIC line, the stub and the font, then the loader, linked
# to run at $C400 where the stub copies it ($C000 is its screen, $C800 the
# font).
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $0800;
    HIGH:     file = "", start = $C400, size = $0400;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    STUB:     load = MAIN,     type = ro;
    LOADER:   load = MAIN, run = HIGH, type = rw, define = yes;
}
